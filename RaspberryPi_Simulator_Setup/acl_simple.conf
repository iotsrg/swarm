# ╔══════════════════════════════════════════════════════════════════════╗
# ║  SWARM Simple ACL — 10 Clients with distinct read/write profiles    ║
# ║  8 vulnerable, 2 secure                                            ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# VULNERABILITY: $SYS broker internals readable by ALL users
# Exposes: clients/connected, uptime, version, message rates
pattern read $SYS/#

# ════════════════════════════════════════════════════════════════════════
# VULNERABLE CLIENTS (8)
# Each has a distinct misconfiguration — different read/write arrows
# ════════════════════════════════════════════════════════════════════════

# ── CLIENT 1: admin_user — DEFAULT CRED + FULL WILDCARD ──────────────
# Vulnerability: default credential admin/admin + unlimited access
# DOT arrows: bidirectional to ALL topics
user admin_user
topic readwrite #

# ── CLIENT 2: esp32_sensor — WRITE-ONLY TO WRONG TOPICS ──────────────
# Vulnerability: device can WRITE to admin/cmd (should never happen)
# DOT arrows: → sensors/esp32/data (ok), → admin/cmd (DANGEROUS write)
user esp32_sensor
topic write sensors/esp32/data
topic write admin/cmd
topic write control/esp32/commands

# ── CLIENT 3: hvac_ctrl — READS TOO BROADLY ──────────────────────────
# Vulnerability: HVAC reads ALL sensor data, not just its own zone
# DOT arrows: sensors/# → hvac_ctrl (over-read), hvac_ctrl → control/hvac
user hvac_ctrl
topic read sensors/#
topic readwrite control/hvac/#
topic write admin/cmd

# ── CLIENT 4: camera_01 — WILDCARD READ (EAVESDROPPING) ──────────────
# Vulnerability: camera subscribes to # — sees ALL traffic including creds
# DOT arrows: # → camera_01 (reads everything), camera_01 → camera/events
user camera_01
topic read #
topic write camera/01/events
topic write camera/01/motion

# ── CLIENT 5: plc_ctrl — WRITES TO ALL CONTROL TOPICS ────────────────
# Vulnerability: PLC can write to ALL actuators + send admin commands
# DOT arrows: plc_ctrl → plc/status (ok), → control/actuators/# (dangerous)
user plc_ctrl
topic readwrite plc/line_01/#
topic write control/actuators/#
topic write admin/cmd
topic read plc/#

# ── CLIENT 6: energy_mgr — READS BROKER INTERNALS ($SYS) ────────────
# Vulnerability: energy meter reads $SYS — broker recon data
# DOT arrows: $SYS/# → energy_mgr (dangerous), energy_mgr → energy/readings
user energy_mgr
topic readwrite energy/meter/#
topic read $SYS/#
topic write admin/cmd

# ── CLIENT 7: gateway — FULL WILDCARD BOTH WAYS ──────────────────────
# Vulnerability: gateway has complete broker control, same as admin
# DOT arrows: bidirectional to ALL topics (most dangerous client)
user gateway
topic readwrite #

# ── CLIENT 8: ota_server — READS ALL, WRITES FIRMWARE TO ALL DEVICES ─
# Vulnerability: reads all traffic + can push OTA firmware to any device
# DOT arrows: # → ota_server (reads all), ota_server → admin/ota/# + admin/cmd
user ota_server
topic read #
topic write admin/ota/#
topic write admin/cmd

# ════════════════════════════════════════════════════════════════════════
# SECURE CLIENTS (2)
# Properly configured — least privilege, no dangerous permissions
# ════════════════════════════════════════════════════════════════════════

# ── CLIENT 9: monitor_svc — READ-ONLY, SPECIFIC TOPICS ───────────────
# Correctly configured: only reads what it needs, never writes
# DOT arrows: sensors/# → monitor_svc, energy/meter/# → monitor_svc (READ ONLY)
user monitor_svc
topic read sensors/#
topic read energy/meter/#

# ── CLIENT 10: audit_svc — MINIMAL READ + SPECIFIC WRITE ─────────────
# Correctly configured: reads logs only, writes only to its own namespace
# DOT arrows: logs/# → audit_svc (read), audit_svc → audit/reports/# (specific write)
user audit_svc
topic read logs/#
topic write audit/reports/#
