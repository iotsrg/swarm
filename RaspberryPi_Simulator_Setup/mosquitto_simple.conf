# ╔══════════════════════════════════════════════════════════════════════╗
# ║  SWARM Simple Test Broker — 1 Broker, 10 Clients                   ║
# ║  mosquitto_simple.conf — Mosquitto 2.x compatible                  ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# VULNERABILITIES PLANTED:
#   CRITICAL : allow_anonymous false but admin/admin accepted (default cred)
#   CRITICAL : No TLS — all traffic in plain text
#   CRITICAL : ACL grants write to admin/cmd for device accounts
#   HIGH     : No message_size_limit
#   HIGH     : No max_connections or rate limiting
#   HIGH     : Retained messages with no topic restrictions
#   MEDIUM   : $SYS/# readable by non-admin users
#   MEDIUM   : Log file world-readable
#   LOW      : No bind address restriction

listener 1883 0.0.0.0

# Auth is on — but default credentials exist in passwd file
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl_simple.conf

# VULNERABILITY: Persistence — retained messages survive restarts
persistence true
persistence_location /var/lib/mosquitto/

# VULNERABILITY: No message_size_limit, no max_connections, no rate limiting
# message_size_limit 0  ← not set = unlimited
# max_connections -1    ← not set = unlimited

# VULNERABILITY: Full logging to world-readable file
log_dest file /var/log/mosquitto/mosquitto.log
log_type all
connection_messages true
log_timestamp true
